  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Golden Circle — Event Details</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&amp;family=DM+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #081523;
      --ivory: #f5f0e7;
      --muted: #c7c4bd;
      --gold: #d9bd82;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--navy);
      color: var(--ivory);
      font-family: "DM Sans", sans-serif;
    }
    button, input, select, textarea { font-family: "DM Sans", sans-serif; }

    .event-section {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(50px, 5vw, 70px) clamp(20px, 5vw, 72px);
      background: var(--navy);
    }
    .event-inner { width: min(100%, 1120px); }
    .eyebrow {
      margin: 0 0 13px;
      color: var(--gold);
      text-align: center;
      text-transform: uppercase;
      letter-spacing: .3em;
      font-size: 10px;
      font-weight: 500;
    }
    h1 {
      margin: 0 0 clamp(24px, 3vw, 34px);
      text-align: center;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(45px, 5.5vw, 70px);
      font-weight: 500;
      line-height: 1;
    }

    .essentials {
      position: relative;
      width: min(100%, 900px);
      height: 420px;
      margin: 0 auto;
    }
    .flow-line {
      position: absolute;
      z-index: 0;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      fill: none;
    }
    .flow-line-mobile { display: none; }
    @media (max-width: 700px) {
      .flow-line-desktop { display: none; }
      .flow-line-mobile { display: block; }
    }
    .flow-base { stroke: #dfc99f; stroke-opacity: .78; stroke-width: .85; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
    .flow-shimmer { stroke: #f2d9a8; stroke-opacity: .1; stroke-width: .85; stroke-linecap: round; vector-effect: non-scaling-stroke; animation: celestial-shimmer 8s ease-in-out infinite alternate; }
    @keyframes celestial-shimmer { 0%, 100% { stroke-opacity: .08; } 50% { stroke-opacity: .24; } }
    .flow-spark { fill: #dfc99f; transition: fill .3s ease, filter .3s ease; }
    .essentials:has(#date-panel:is(:hover, :focus-within)) .dot-date,
    .essentials:has(#colors-panel:is(:hover, :focus-within)) .dot-colors,
    .essentials:has(#location-panel:is(:hover, :focus-within)) .dot-location,
    .essentials:has(#date-panel:is(:hover, :focus-within)) .spark-date,
    .essentials:has(#colors-panel:is(:hover, :focus-within)) .spark-colors,
    .essentials:has(#location-panel:is(:hover, :focus-within)) .spark-location {
      fill: #fff1cf;
      filter: drop-shadow(0 0 7px rgba(242, 217, 168, .95));
    }
    .essential {
      position: absolute;
      z-index: 1;
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr);
      grid-template-rows: auto auto auto;
      align-content: center;
      column-gap: 13px;
      width: 275px;
      min-width: 0;
      padding: 5px 8px;
      text-align: left;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .7s ease, transform .7s ease, color .3s ease;
    }
    .essential:is(:hover, :focus-within) { color: #fff9ed; }
    .essential:focus-visible { outline: 1px solid var(--gold); outline-offset: 5px; }
    .essential .illustration { grid-column: 1; grid-row: 1 / 4; align-self: center; }
    .essential .essential-label { grid-column: 2; grid-row: 1; }
    .essential > div:not(.illustration), .essential > .dress-copy { grid-column: 2; grid-row: 2; }
    .essential > div.swatches { grid-column: 2; grid-row: 3; }
    .visible #date-panel { opacity: 1; transform: none; transition-delay: .15s; }
    .visible #colors-panel { opacity: 1; transform: none; transition-delay: .35s; }
    .visible #location-panel { opacity: 1; transform: none; transition-delay: .55s; }
    #date-panel { top: 99px; right: 0; width: 230px; }
    #location-panel { top: 63px; left: 29%; width: 275px; }
    #colors-panel { top: 288px; left: 9%; width: 305px; }
    #colors-panel .swatches { justify-content: flex-start; flex-wrap: nowrap; gap: 11px; margin-top: 13px; }
    .illustration {
      height: 56px;
      width: 100%;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gold);
    }
    .line-art {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.45;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .calendar-art { width: 48px; height: 52px; }
    .map-art { width: 56px; height: 52px; }
    .outfits { gap: 3px; }
    .outfits svg { width: 26px; height: 54px; }
    .essential-label {
      margin: 0 0 6px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .23em;
      text-transform: uppercase;
    }
    .essential-value {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(24px, 2.4vw, 32px);
      font-weight: 500;
      line-height: 1.08;
    }
    .secondary-value {
      margin: 3px 0 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 23px;
      line-height: 1.1;
    }
    .dress-copy {
      max-width: 290px;
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(20px, 2vw, 25px);
      line-height: 1.15;
    }
    .swatches {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: clamp(6px, .85vw, 11px);
      margin: 9px 0 0;
    }
    .swatch {
      display: block;
      width: clamp(17px, 1.7vw, 22px);
      height: clamp(17px, 1.7vw, 22px);
      border-radius: 50%;
      border: 1px solid rgba(245, 240, 231, .2);
    }
    .swatch.navy { background: #101e39; }
    .swatch.royal { background: #24578e; }
    .swatch.black { background: #05080c; }
    .swatch.white { background: #fff; }
    .swatch.gold { background: #d9bd82; }
    .address {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    .calendar-link, .directions {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 3px;
      border: 0;
      background: none;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .08em;
      text-decoration: underline;
      text-underline-offset: 4px;
      cursor: pointer;
    }
    .calendar-link:hover, .directions:hover { color: var(--ivory); }
    .calendar-link:focus-visible, .directions:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 4px;
    }
    .direction-status {
      min-height: 18px;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.35;
    }

    @media (max-width: 700px) {
      .event-section { padding: 40px 18px; }
      h1 { margin-bottom: 27px; }
      .essentials { width: min(100%, 480px); height: 540px; }
      .essential { grid-template-columns: 38px minmax(0, 1fr); grid-template-rows: auto auto auto; column-gap: 6px; padding: 4px; }
      #date-panel { top: 49px; right: 0; left: auto; width: min(53%, 220px); }
      #location-panel { top: 187px; left: 2%; width: min(57%, 245px); }
      #colors-panel { top: 392px; left: 5%; width: min(75%, 300px); }
      .essential .illustration { grid-column: 1; grid-row: 1 / 4; justify-content: flex-start; height: 39px; margin-bottom: 3px; }
      .essential .essential-label { grid-column: 2; grid-row: 1; }
      .essential > div:not(.illustration), .essential > .dress-copy { grid-column: 2; grid-row: 2; }
      .essential > .swatches { grid-column: 2; grid-row: 3; }
      .calendar-art { width: 34px; height: 38px; }
      .map-art { width: 42px; height: 38px; }
      .outfits svg { width: 18px; height: 38px; }
      .essential-label { font-size: 9px; letter-spacing: .13em; margin-bottom: 5px; }
      .essential-value { font-size: clamp(21px, 5vw, 27px); }
      .secondary-value { font-size: 20px; }
      .dress-copy { font-size: clamp(17px, 4.3vw, 21px); }
      .address { font-size: 10px; }
      .swatches { justify-content: flex-start; flex-wrap: nowrap; gap: 5px; }
      .swatch { flex: 0 0 17px; width: 17px; height: 17px; }
    }
    @media (max-width: 380px) {
      .essentials { height: 565px; }
      #date-panel { width: 57%; }
      #location-panel { width: 63%; }
      #colors-panel { top: 407px; width: 82%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .essential, .visible .essential {
        opacity: 1;
        transform: none;
        transition: none;
      }
      .flow-base, .visible .flow-base {
        stroke-dashoffset: 0;
        transition: none;
      }
      .flow-dot { transition: none; }
      .flow-shimmer { animation: none; }
    }
    /* Ceremonial event timeline: one straight thread through three seals. */
    #event-details { background: #081523ff; color: #f4eee2; padding: 48px 20px 54px; }
    #event-details .eyebrow, #event-details .essential-label { color: #dfc28a; }
    #event-details .essentials { width: min(100%, 490px); height: auto; display: grid; gap: 25px; position: relative; margin: 0 auto; }
    #event-details .essentials::before { content: ''; position: absolute; top: 24px; bottom: 24px; left: 23px; width: 1px; background: #dfc28a; opacity: .72; pointer-events: none; }
    #event-details .essential { position: relative; top: auto; left: auto; right: auto; z-index: 1; width: 100%; min-width: 0; padding: 0; display: grid; grid-template-columns: 47px minmax(0, 1fr); grid-template-rows: auto; column-gap: 29px; align-items: center; opacity: 1; transform: none; transition: none; color: #f4eee2; }
    #event-details .essential:is(:hover, :focus-within) { color: #f4eee2; }
    #event-details .seal { grid-column: 1; grid-row: 1; width: 47px; height: 47px; border-radius: 50%; position: relative; display: grid; place-items: center; color: #69502c; background: radial-gradient(circle at 34% 27%, #f3dfa9 0%, #e6ca91 27%, #cba669 72%, #a9844d 100%); border: 1px solid #f5dea7; box-shadow: inset 0 0 0 3px rgba(111,78,39,.17), inset 0 0 0 5px rgba(255,241,201,.32), 0 2px 7px rgba(0,0,0,.26); transition: filter .25s ease; }
    #event-details .seal::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(111,78,39,.33); border-radius: 50%; box-shadow: inset 1px 1px 2px rgba(101,68,31,.16), 1px 1px 0 rgba(255,245,215,.55); pointer-events: none; }
    #event-details .essential:is(:hover, :focus-within) .seal { filter: brightness(1.13); }
    #event-details .seal svg { width: 24px; height: 24px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(255,248,218,.6)); }
    #event-details .detail-content { grid-column: 2; grid-row: 1; min-width: 0; }
    #event-details .essential-label { margin: 0 0 5px; font-size: 10px; letter-spacing: .23em; }
    #event-details .essential-value { font-size: clamp(27px, 3vw, 32px); }
    #event-details .secondary-value { font-size: 23px; }
    #event-details .dress-copy { max-width: none; font-size: clamp(21px, 2.5vw, 25px); line-height: 1.17; }
    #event-details .address { margin-top: 5px; }
    #event-details .calendar-link, #event-details .directions { color: #dfc28a; }
    #event-details .calendar-link:hover, #event-details .directions:hover { color: #f4eee2; }
    #event-details #colors-panel .swatches { width: max-content; max-width: 100%; justify-content: flex-start; flex-wrap: nowrap; gap: 12px; margin-top: 14px; }
    #event-details .swatch { flex: 0 0 19px; width: 19px; height: 19px; }
    #event-details .direction-status:empty { display: none; }
    @media (max-width: 700px) {
      #event-details { padding: 40px 18px 44px; }
      #event-details .essentials { width: min(100%, 430px); gap: 24px; }
      #event-details .essentials::before { top: 19px; bottom: 19px; left: 18px; }
      #event-details .essential { grid-template-columns: 37px minmax(0, 1fr); column-gap: 20px; }
      #event-details .seal { width: 37px; height: 37px; }
      #event-details .seal::after { inset: 6px; }
      #event-details .seal svg { width: 19px; height: 19px; }
      #event-details .essential-label { font-size: 9px; letter-spacing: .16em; }
      #event-details .essential-value { font-size: 26px; }
      #event-details .dress-copy { font-size: 21px; }
      #event-details .swatch { flex-basis: 18px; width: 18px; height: 18px; }
    }
    @media (max-width: 380px) {
      #event-details .essentials { height: auto; }
      #event-details .essential { column-gap: 16px; }
      #event-details .dress-copy { font-size: 19px; }
      #event-details #colors-panel .swatches { gap: 9px; }
    }
    /* Direct RSVP form in the invitation's midnight-and-champagne palette. */

  <script>
    const constellationFooter = document.getElementById('jp-universe');
    const closingMessage = constellationFooter.querySelector('.universe-closing');
    if ('IntersectionObserver' in window) {
      const closingObserver = new IntersectionObserver(entries => {
        if (entries[0].isIntersecting) {

          closingObserver.disconnect();
        }

    const orbitSvg = document.getElementById('subsidiary-orbits');
    const reducedOrbitMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const orbiters = [...constellationFooter.querySelectorAll('.subsidiary-list li')].map((item, index) => ({
      item, button: item.querySelector('button'),
      ring: [0, 0, 0, 1, 0, 0][index],
      index,
      speed: [0.00015, 0.00013, 0.00011, 0.00014, 0.00012, 0.00015][index],
      paused: false,
      heldAngle: null
    }));
    orbiters.forEach(orbiter => {
      const pause = () => { orbiter.paused = true; };
      const resume = () => { orbiter.paused = false; };
      orbiter.button.addEventListener('mouseenter', pause);
      orbiter.button.addEventListener('mouseleave', resume);
      orbiter.button.addEventListener('focus', pause);
      orbiter.button.addEventListener('blur', resume);
      let glowTimer;
      orbiter.button.addEventListener('click', () => {
        orbiter.button.classList.add('is-lit');
        clearTimeout(glowTimer);
        glowTimer = setTimeout(() => orbiter.button.classList.remove('is-lit'), 900);
      });
    });
    let orbitGeometry;
    function updateOrbitGeometry() {
      const width = orbitStage.clientWidth;
      const height = orbitStage.clientHeight;
      const mobile = window.matchMedia('(max-width: 700px)').matches;
      const cx = width / 2;
      const outer = width * (mobile ? .525 : .515);
      const cy = outer + (mobile ? 15 : 23);
      const radii = [outer, outer * (mobile ? .85 : .87), outer * (mobile ? .70 : .74)];
      const edge = mobile ? Math.max(38, width * .105) : Math.max(52, width * .07);
      const xTargets = mobile
        ? [edge, width * .27, width * .44, width * .62, width * .80, width - edge]
        : [edge, width * .255, width * .425, width * .61, width * .79, width - edge];
      const baseAngles = orbiters.map((orbiter, index) => Math.acos(Math.max(-1, Math.min(1, (xTargets[index] - cx) / radii[orbiter.ring]))));
      orbitGeometry = { width, height, cx, cy, radii, mobile, baseAngles };
      orbitSvg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      const svgNS = 'http://www.w3.org/2000/svg';

        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('class', 'orbit-line');
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', r);
        orbitSvg.appendChild(circle);
      });
      const fourthRadius = Math.max(8, Math.min(radii[2] * .78, cy - height + (mobile ? 18 : 28)));
      const defs = document.createElementNS(svgNS, 'defs');
      const gradient = document.createElementNS(svgNS, 'linearGradient');
      gradient.setAttribute('id', 'fourth-orbit-gold');
      gradient.setAttribute('gradientUnits', 'userSpaceOnUse');
      gradient.setAttribute('x1', cx - fourthRadius);
      gradient.setAttribute('x2', cx + fourthRadius);
      gradient.setAttribute('y1', 0);
      gradient.setAttribute('y2', 0);
      [['0%', '#b77a36', '.32'], ['30%', '#e8aa61', '.7'], ['44%', '#ffe4aa', '.95'], ['50%', '#fff7da', '1'], ['56%', '#ffe4aa', '.95'], ['70%', '#e8aa61', '.7'], ['100%', '#b77a36', '.32']].forEach(([offset, color, opacity]) => {
        const stop = document.createElementNS(svgNS, 'stop');
        stop.setAttribute('offset', offset);
        stop.setAttribute('stop-color', color);
        stop.setAttribute('stop-opacity', opacity);
        gradient.appendChild(stop);
      });
      defs.appendChild(gradient);
      orbitSvg.appendChild(defs);
      ['fourth-halo', 'fourth-glow', 'fourth-core'].forEach(layer => {
        const circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('class', `fourth-orbit ${layer}`);
        circle.setAttribute('cx', cx);
        circle.setAttribute('cy', cy);
        circle.setAttribute('r', fourthRadius);
        orbitSvg.appendChild(circle);
      });
      [[0,112],[0,74],[0,39],[1,140],[1,94],[1,46]].forEach(([ring, degrees]) => {
        const angle = degrees * Math.PI / 180;
        const dot = document.createElementNS(svgNS, 'circle');
        dot.setAttribute('class', 'orbit-spark');
        dot.setAttribute('cx', cx + radii[ring] * Math.cos(angle));
        dot.setAttribute('cy', cy - radii[ring] * Math.sin(angle));
        dot.setAttribute('r', mobile ? 1.15 : 1.65);
        orbitSvg.appendChild(dot);
      });
    }
    updateOrbitGeometry();
    window.addEventListener('resize', updateOrbitGeometry);
    function drawOrbits(time) {
      const { cx, cy, radii, mobile, baseAngles } = orbitGeometry;
      orbiters.forEach(orbiter => {
        const base = baseAngles[orbiter.index];
        const drift = reducedOrbitMotion.matches ? 0 : Math.sin(time * orbiter.speed + orbiter.index * .7) * (mobile ? .008 : .014);
        const angle = orbiter.paused ? (orbiter.heldAngle ?? base) : base + drift;
        orbiter.heldAngle = angle;
        const x = cx + radii[orbiter.ring] * Math.cos(angle);
        const y = cy - radii[orbiter.ring] * Math.sin(angle);
        orbiter.item.style.left = x + 'px';
        orbiter.item.style.top = y + 'px';
      });
      requestAnimationFrame(drawOrbits);
    }
    requestAnimationFrame(drawOrbits);
